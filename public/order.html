<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#07070b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍦</text></svg>">
<link rel="stylesheet" href="/css/style.css"><script src="/js/theme.js"></script><title>Order online</title></head>
<body data-page="order"><header class="site-header" id="site-header"></header>
<main class="wrap" id="order-area">
  <h1 class="neon-pink" style="font-size:clamp(2rem,6vw,3rem)">Order online</h1>
  <p class="sample-note"><span class="ico">💵</span> <span id="pay-note">Cash on delivery only.</span> <span id="min-note"></span> Prices are sample prices.</p>
  <noscript><div class="toast bad">Please enable JavaScript to order online, or call us.</div></noscript>
  <form id="order-form" method="post" action="/order" novalidate>
    <div class="order-layout">
      <div>
        <section class="card"><h2 class="neon-cyan">1. Pick your ice cream</h2><div id="items"></div><span class="err" id="err-items"></span></section>
        <section class="card"><h2 class="neon-cyan">2. Delivery or pickup?</h2>
          <div class="choice"><label><input type="radio" name="fulfilment" value="delivery" checked> <span class="ico">🛵</span> Delivery in Lahore</label>
          <label><input type="radio" name="fulfilment" value="pickup"> <span class="ico">🏭</span> Pickup from factory</label></div><span class="err" id="err-fulfilment"></span>
          <div id="address-block"><label for="address">Delivery address (Lahore)</label>
            <textarea id="address" name="address" rows="2" placeholder="House #, street, block, area, Lahore" autocomplete="street-address"></textarea><span class="err" id="err-address"></span>
            <label for="area">Area / landmark (optional)</label><input id="area" name="area" placeholder="e.g. near main market">
            <small id="area-note" style="color:var(--muted)"></small></div>
          <div class="form-grid"><div><label for="date">Preferred date</label><input type="date" id="date" name="date" required><span class="err" id="err-date"></span></div>
          <div><label for="time">Preferred time</label><input type="time" id="time" name="time" required><span class="err" id="err-time"></span></div></div>
        </section>
        <section class="card"><h2 class="neon-cyan">3. Your details</h2>
          <div class="form-grid"><div><label for="name">Your name</label><input id="name" name="name" required autocomplete="name" placeholder="Full name"><span class="err" id="err-name"></span></div>
          <div><label for="phone">Phone (mobile)</label><input id="phone" name="phone" type="tel" inputmode="tel" required autocomplete="tel" placeholder="03xx xxxxxxx"><span class="err" id="err-phone"></span></div>
          <div class="full"><label for="notes">Notes (optional)</label><textarea id="notes" name="notes" rows="2" placeholder="Anything we should know? e.g. call on arrival, birthday order…"></textarea></div></div>
          <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        </section>
      </div>
      <aside class="card glow summary-box"><h2 class="neon-lime">Your order</h2>
        <div id="t-lines" style="margin-bottom:10px"></div>
        <div class="totals"><div><span>Subtotal</span><span id="t-sub">Rs 0</span></div><div><span>Delivery</span><span id="t-fee">–</span></div>
        <div class="grand"><span>Total</span><span id="t-total">Rs 0</span></div></div>
        <div id="form-msg"></div>
        <button class="btn big" id="submit-btn" type="submit" style="width:100%;margin-top:14px">Place order (cash on delivery)</button>
      </aside>
    </div>
  </form>
  <div class="mobile-bar"><div><div class="t" id="bar-total">Rs 0</div><small id="bar-count" style="color:var(--muted)">0 items</small></div>
    <button class="btn" type="button" onclick="document.getElementById('submit-btn').scrollIntoView({behavior:'smooth',block:'center'})">Checkout ↓</button></div>
</main>
<footer id="site-footer"></footer><script src="/js/app.js"></script></body></html>
