<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#07070b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍦</text></svg>">
<link rel="stylesheet" href="/css/style.css"><script src="/js/theme.js"></script><title>Contact</title></head>
<body data-page="contact"><header class="site-header" id="site-header"></header>
<main class="wrap">
  <h1 class="neon-cyan" style="font-size:clamp(2rem,6vw,3rem)">Contact us</h1>
  <div class="contact-grid">
    <section class="card glow"><h2 class="neon-pink">Find us</h2><ul class="info-list" id="contact-info"></ul>
      <h3 class="neon-lime" style="margin-top:18px">Opening hours</h3><ul class="hours" id="hours"></ul><div id="map" style="margin-top:14px"></div>
      <div class="cta-row"><a class="btn" href="/order.html"><span class="ico">🍦</span> Order now</a></div></section>
    <section class="card"><h2 class="neon-pink">Send a message</h2>
      <form id="contact-form" method="post" action="/contact" novalidate>
        <label for="c-name">Name</label><input id="c-name" name="name" required autocomplete="name"><span class="err" id="cerr-name"></span>
        <label for="c-phone">Phone</label><input id="c-phone" name="phone" type="tel" inputmode="tel" placeholder="03xx xxxxxxx" autocomplete="tel"><span class="err" id="cerr-phone"></span>
        <label for="c-email">Email (optional)</label><input id="c-email" name="email" type="email" autocomplete="email"><span class="err" id="cerr-email"></span>
        <label for="c-msg">Message</label><textarea id="c-msg" name="message" rows="5" required placeholder="Bulk/event orders, feedback, questions…"></textarea><span class="err" id="cerr-message"></span>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div id="contact-msg"></div><button class="btn big" type="submit" style="width:100%;margin-top:10px">Send message</button>
      </form></section>
  </div>
</main>
<footer id="site-footer"></footer><script src="/js/app.js"></script></body></html>
